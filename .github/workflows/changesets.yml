name: Changesets

on:
  pull_request:

permissions:
  contents: read

jobs:
  changesets:
    name: Changeset Required
    runs-on: ubuntu-latest
    # A `release/version-packages` PR is the *output* of consuming
    # changesets: `changeset version` bumps package.json/CHANGELOG.md and
    # deletes every .changeset/*.md file it consumed in the same commit.
    # It will always legitimately show package changes with no changeset
    # left to find — that's expected, not a violation. See
    # CONTRIBUTING.md#releasing-changesets.
    #
    # This name is reserved exclusively for that purpose and nothing checks
    # its actual contents here — it must be deleted right after merge and
    # never reused for anything else, or this exemption would silently
    # cover unrelated changes too.
    if: github.head_ref != 'release/version-packages'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        run: corepack install -g pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify a changeset exists for changed packages
        run: pnpm run validate:changeset
