name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test / Build / Lint
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 22.13.0
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install pnpm
        run: corepack install -g pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate

      - name: Build
        run: pnpm build

      # release.yml downloads this instead of rebuilding from source itself —
      # keeps the actual build (arbitrary code from whatever's being released)
      # out of the workflow that holds npm publish permissions. One matrix
      # leg only: this repo is pure TS, build output doesn't vary by OS/Node.
      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-output
          path: packages/*/*/dist
          retention-days: 7

      - name: Lint
        run: pnpm lint

      - name: Format Validation
        run: pnpm run validate:format

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Dependency Architecture Validation
        run: pnpm run validate:deps

      - name: Node Module Resolution Validation
        run: pnpm run validate:node-resolution

      - name: API Validation
        run: pnpm run validate:api

      - name: Document Validation
        run: pnpm run validate:docs

      - name: Verify Packages
        run: pnpm run verify:packages

      - name: Bundle Size Validation
        run: pnpm run validate:size

  security:
    name: Socket Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        run: corepack install -g pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `socket ci` intermittently fails with "Unexpected error reading
      # response text" on Socket's own full-scans report endpoint
      # (unrelated to any real finding — confirmed by re-running the exact
      # same commit and seeing it pass). Retry a few times before actually
      # failing the build, since there's no CLI flag to skip the report
      # step that triggers it.
      - name: Socket Security Scan
        run: |
          for attempt in 1 2 3; do
            if pnpm run validate:socket; then
              exit 0
            fi

            echo "Socket scan attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              echo "Retrying in 30s..."
              sleep 30
            fi
          done

          echo "Socket scan failed after 3 attempts."
          exit 1
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_CLI_API_TOKEN }}

  e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm
        run: corepack install -g pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser e2e tests
        run: pnpm run test:e2e
