name: Release

# Triggered by CI's completion (not `push` directly) so a release can never
# happen on a commit CI hasn't already validated — `push` and `workflow_run`
# firing independently in parallel would let a broken commit publish if CI
# happened to still be running (or failing) when this workflow's own `push`
# trigger fired. This also means every check below (build, lint, typecheck,
# test, audit, validate:api-exports/docs/deps, verify:packages) doesn't need to be
# repeated here: CI already ran all of it on this exact commit, and the `if`
# condition below fails closed if that run didn't succeed.
#
# As a side effect, this also follows GitHub's recommended pattern for
# workflows that need write-ish permissions (here: OIDC publish access) to
# run in response to a PR: `workflow_run` always executes the workflow file
# as committed on the base branch, never a PR's own (possibly modified) copy.
# That alone isn't sufficient, though — ci.yml runs on `pull_request` too
# (forks included), and a fork PR's own workflow_run completion event
# reports the fork's own branch name, which the attacker chooses. The job
# `if:` below additionally requires the CI run to have been triggered by
# `push`, closing that off. See the job-level `if:` comment for detail.
#
# `workflow_dispatch` is a manual recovery path only: it never runs `pnpm
# release` (no re-publish), it just (re)creates a signed tag + GitHub
# Release for a package version that's already on npm — for when the
# publish itself succeeded but tagging failed or was skipped for some
# reason. See CONTRIBUTING.md#releasing-changesets.
#
# This recovery path only works if the commit being tagged is STILL the
# default branch's current tip. GITHUB_TOKEN structurally cannot push a
# tag pointing at an older commit whose `.github/workflows/*` content
# differs from what's currently on the default branch — GitHub rejects it
# with "refusing to allow a GitHub App to create or update workflow
# ... without workflows permission", regardless of tag signing, clone
# depth, or using the REST API instead of `git push` (all tested; no
# `permissions:` grant fixes this — `workflows` isn't even a valid
# GITHUB_TOKEN permission key). A human's own git push is exempt from this
# restriction and always works. Confirmed 2026-08-14: this recovery path
# failed for a package's release because a later PR (#212, a fix
# to this very file) had already moved main's tip past the release commit
# by the time recovery was attempted — recovered by pushing the tag
# manually (unsigned, since gitsign's OIDC signing isn't available outside
# Actions) instead. If this recovery path is needed again and the commit
# is no longer the tip, expect the same failure and use the same manual
# workaround — don't re-diagnose this from scratch.
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated <name>@<version> tags to sign, tag, and release. Each package MUST already be published on npm at that version — this never runs `pnpm release`.'
        required: true
      sha:
        description: 'Commit SHA to tag (defaults to the current main HEAD).'
        required: false

# No top-level `permissions:` — scoped to the job below instead, per
# least-privilege (this is a single-job workflow, so it makes no functional
# difference, but a top-level grant applies to every job by default,
# present or future, which is what OpenSSF Scorecard's Token-Permissions
# check flags).
permissions: {}

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    # `github.event.workflow_run.event == 'push'` matters as much as
    # `conclusion == 'success'` does: without it, a CI run that was itself
    # triggered by `pull_request` (ci.yml runs on both) also produces a
    # `workflow_run` completion event, and for a *fork* PR that event's
    # `head_branch` is the fork's own branch name — fully attacker-chosen,
    # so an attacker can just name their fork branch `main` to match the
    # `branches: [main]` filter above. Gating on the CI run's own trigger
    # event closes that off: only a `push` to main (i.e. a real merge)
    # can ever produce a workflow_run this condition accepts. This is
    # GitHub's documented "pwn request" mitigation for `workflow_run`.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    # id-token: write lets this workflow request a short-lived OIDC token from
    # GitHub's Actions identity provider. npm's Trusted Publisher feature (configured
    # per-package on npmjs.com, associated with this exact repo + workflow file) uses
    # that token to authenticate the publish — no long-lived NPM_TOKEN secret exists
    # in this repo, and none should ever be added back. See SECURITY.md. gitsign
    # (below) reuses this same token to sign tags, keyless.
    #
    # actions: read is only for downloading CI's build-output artifact below —
    # nothing here writes to Actions.
    #
    # contents: write is only used to push the git tags created after a
    # successful publish (below) — this workflow never pushes to a branch.
    permissions:
      contents: write
      id-token: write
      actions: read

    steps:
      # Split into two steps (one per trigger) instead of one step with a
      # combined ref expression: OpenSSF Scorecard's Dangerous-Workflow
      # check pattern-matches for `github.event.workflow_run.head_sha`
      # checkouts and couldn't recognize this as the same already-reviewed
      # safe pattern once folded into a larger ternary. Each step's `ref:`
      # is simple and only evaluated for its own trigger.
      - name: Checkout repository (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pin to the exact commit CI validated — without this, checkout
          # defaults to the latest commit on main, which could differ if
          # more commits landed on main between CI finishing and this job
          # starting.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout repository (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pin to the given `sha` input, or main HEAD (the default ref
          # this event already checks out) if omitted. workflow_dispatch
          # can only be triggered by someone with write access to this
          # repo, so — unlike workflow_run's head_sha — this isn't an
          # untrusted value.
          ref: ${{ inputs.sha || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        run: corepack install -g pnpm@11.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Installs gitsign and configures git (tag.gpgsign true, gpg.format
      # x509) to sign every tag we create below. Keyless: gitsign uses this
      # job's own GitHub Actions OIDC token (the same `id-token: write`
      # permission already granted above for npm) to get a short-lived
      # signing certificate from Sigstore's Fulcio — there is no private
      # signing key to store as a secret, consistent with the OIDC-only
      # approach used for npm publishing. See SECURITY.md.
      - name: Setup gitsign
        uses: chainguard-dev/actions/setup-gitsign@7bd1e94b2a1b7faa891392757de7d89489070c5c # v1.6.32

      # Everything below is the real build-and-publish path — skipped
      # entirely in workflow_dispatch recovery mode, since the package(s)
      # named in `tags` are already published.
      - name: Download build artifacts from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output
          path: packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Generate SBOMs
        if: github.event_name == 'workflow_run'
        run: pnpm run sbom

      - name: Upload SBOMs
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom
          path: sbom/
          retention-days: 90

      # No NPM_TOKEN / NODE_AUTH_TOKEN here: `changeset publish` shells out to
      # `npm publish`, which authenticates via the OIDC token requested above
      # (npm Trusted Publisher — configured on npmjs.com for each package to
      # trust this workflow specifically). Requires npm >= 11.5.1, which Node 24
      # ships with; if this step starts failing with an auth error, check the
      # bundled npm version before assuming the trusted publisher config broke.
      # NPM_CONFIG_PROVENANCE additionally attests the published tarball back to
      # this exact commit/workflow run (visible as the "Provenance" badge on npm).
      - name: Release
        if: github.event_name == 'workflow_run'
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: true
          # `changeset publish`'s human-readable stdout summary is not a
          # reliable signal for which packages actually got tagged — see the
          # comment on the step below. CHANGESETS_OUTPUT (read by the CLI
          # itself, not a documented `publish` flag but real in the pinned
          # version) makes it write one JSON-lines event per action instead,
          # including a `{"type":"git-tag","tag":"<name>@<version>"}` entry
          # for every tag it actually creates — parsed below via `jq`.
          CHANGESETS_OUTPUT: ${{ runner.temp }}/changesets-report.ndjson

      # We can't use changesets/action to create the GitHub Release directly —
      # it wants a long-lived NPM_TOKEN, which this repo deliberately doesn't
      # have (OIDC Trusted Publisher instead, see SECURITY.md) — so replicate
      # just the tagging + release step here.
      #
      # Do NOT determine which tags to create by grepping `changeset
      # publish`'s stdout (e.g. a "New tag: <name>@<version>" line) — that
      # was this step's original approach, and @changesets/cli@3.0.0 broke it
      # silently: `publish.mjs`'s final summary message filters
      # `results.tagged` through a `tagOnlyReleases` Set that only contains
      # packages already marked tag-only in the release plan (root/private
      # packages), never packages that were just npm-published — so for a
      # normal publish the printed summary is just "Created git tags." with
      # no package name at all, even though the tag was genuinely created.
      # This went unnoticed from the v3 bump (#206) until the next real
      # publish (#211), which published to npm but silently skipped
      # tagging/releasing. Reading structured events from CHANGESETS_OUTPUT
      # instead reads directly from where the tag is created (`git.tag()`),
      # upstream of that broken summary formatting.
      #
      # In workflow_dispatch recovery mode, the tag list comes directly
      # from the `tags` input instead.
      #
      # Tag existence is still checked against the REMOTE (`git ls-remote`),
      # not local refs — `changeset publish` (the `pnpm release` step above)
      # already creates a local, unsigned tag of the same name as a side
      # effect of publishing, so a local-only check like `git rev-parse
      # --verify refs/tags/<tag>` always finds that tag and skips creating
      # our signed one, silently dropping the push + GitHub Release. This is
      # what caused automatic tagging to do nothing on 2026-08-02, requiring
      # the workflow_dispatch recovery path to fix it by hand. The full
      # `refs/tags/<tag>` form (not a bare tag name) makes the `ls-remote`
      # pattern match only an exact tag ref, not any other ref that happens
      # to share a suffix.
      - name: Tag & release published packages
        env:
          CHANGESETS_REPORT: ${{ runner.temp }}/changesets-report.ndjson
          DISPATCH_TAGS: ${{ inputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tags=$(echo "$DISPATCH_TAGS" | tr ',' '\n' | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')
          else
            tags=$(jq -r 'select(.type == "git-tag") | .tag' "$CHANGESETS_REPORT" 2>/dev/null || true)
          fi

          if [ -z "$tags" ]; then
            echo "No packages published in this run — nothing to tag."
            exit 0
          fi

          echo "$tags" | while IFS= read -r tag; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists on origin, skipping."
              continue
            fi

            # Drop changesets' own unsigned local tag (if any) before
            # creating ours — see the comment above this step.
            git tag -d "$tag" >/dev/null 2>&1 || true

            git tag -s "$tag" -m "$tag"
            git push origin "$tag"

            notes=$(npx tsx scripts/release/release-notes-run.ts "$tag")
            gh release create "$tag" --title "$tag" --notes "$notes"
          done
