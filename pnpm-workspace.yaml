packages:
  - 'packages/**/*'

overrides:
  esbuild: ^0.28.2
  brace-expansion: ^5.0.9
  fast-uri: ^3.1.5
  postcss: ^8.5.18
  qs: ^6.15.2
  js-yaml@^3.0.0: ^3.15.1
  js-yaml@^4.0.0: ^4.3.1
  nanoid@^3.0.0: ^3.3.17

allowBuilds:
  esbuild: true
  unrs-resolver: true

# pnpm 11 already defaults to this exact value — stated explicitly so the
# policy is visible here instead of relying on an undocumented tool default.
minimumReleaseAge: 1440
